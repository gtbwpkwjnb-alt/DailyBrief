name: Daily Brief

# Generate a fresh daily report and publish to GitHub Pages.
#
# One-time setup for forkers (see README → "Run on GitHub Actions"):
#   1. Settings → Actions → General → enable workflows (forked repos start disabled)
#   2. Settings → Pages → Build & deployment → Source: "Deploy from a branch" → gh-pages / root
#   3. Settings → Secrets and variables → Actions:
#        - Secrets: ANTHROPIC_API_KEY (or OPENAI / DEEPSEEK / MINIMAX / ZHIPU as you prefer)
#        - Variables (all optional, sensible defaults provided):
#            LLM_BACKEND     anthropic | openai | deepseek | minimax | zhipu    (default: anthropic)
#            LLM_MODEL       e.g. claude-sonnet-4-6 / gpt-4o-mini       (backend default if unset)
#            REPORT_LOCALE   zh | en                                    (default: zh)
#            REPORT_TZ       IANA tz, e.g. Asia/Shanghai / UTC          (default: UTC in CI)
#            REPORT_HOUR     trigger hour(s) in REPORT_TZ, comma-list   (default: 6,18 — 06:00/18:00)
#                            examples: "6,18" / "8" / "0,6,12,18"
#            REPORT_DAYS     day-of-week filter (cron-style 0-6 SUN=0)  (default: * — every day)
#                            examples: "*" / "1-5" (weekdays) / "1,3,5" (MWF)
#   4. Trigger once manually from Actions tab to seed gh-pages.
#
# Schedule: UTC probes for 06:00 and 18:00 Asia/Shanghai; each target hour has
# two probes so a delayed GitHub cron event can still pass the time gate.
# A "gate" job checks REPORT_HOUR in REPORT_TZ and only allows the build when
# they match. workflow_dispatch always bypasses the gate.

on:
  schedule:
    - cron: "7,37 10,22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  gate:
    name: Time gate
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
    steps:
      - name: Check schedule
        id: check
        env:
          REPORT_TZ: ${{ vars.REPORT_TZ }}
          REPORT_HOUR: ${{ vars.REPORT_HOUR }}
          REPORT_DAYS: ${{ vars.REPORT_DAYS }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual trigger - bypassing time gate"
            echo "should-run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TZ_VAL="${REPORT_TZ:-UTC}"
          HOURS_VAL="${REPORT_HOUR:-6,18}"
          DAYS_VAL="${REPORT_DAYS:-*}"
          NOW_HOUR=$(TZ="$TZ_VAL" date +%-H)
          NOW_DOW=$(TZ="$TZ_VAL" date +%w)
          NOW_PRINT=$(TZ="$TZ_VAL" date '+%Y-%m-%d %H:%M %Z')
          echo "Now in $TZ_VAL: $NOW_PRINT (hour=$NOW_HOUR, dow=$NOW_DOW)"
          echo "Configured REPORT_HOUR='$HOURS_VAL', REPORT_DAYS='$DAYS_VAL'"

          hour_match=false
          IFS=',' read -ra HLIST <<< "$HOURS_VAL"
          for h in "${HLIST[@]}"; do
            h_trim="${h// /}"
            if [ "$NOW_HOUR" = "$h_trim" ]; then hour_match=true; break; fi
          done

          day_match=false
          if [ "$DAYS_VAL" = "*" ]; then
            day_match=true
          else
            IFS=',' read -ra DLIST <<< "$DAYS_VAL"
            for d in "${DLIST[@]}"; do
              d_trim="${d// /}"
              if [ "$NOW_DOW" = "$d_trim" ]; then day_match=true; break; fi
            done
          fi

          # Catchup: if day matches but exact hour doesn't, AND we're past
          # the earliest REPORT_HOUR, AND today's report is missing from
          # gh-pages → build anyway. This covers GitHub Actions silently
          # dropping cron triggers (~30% of runs).
          catchup_match=false
          if [ "$day_match" = "true" ] && [ "$hour_match" = "false" ]; then
            earliest_hour=99
            for h in "${HLIST[@]}"; do
              h_trim="${h// /}"
              if [ "$h_trim" -lt "$earliest_hour" ]; then earliest_hour=$h_trim; fi
            done
            # Tolerate 1h early to catch pre-hour triggers
            catchup_threshold=$earliest_hour
            if [ "$earliest_hour" -gt 0 ]; then catchup_threshold=$((earliest_hour - 1)); fi
            if [ "$NOW_HOUR" -ge "$catchup_threshold" ]; then
              TODAY=$(TZ="$TZ_VAL" date +%Y-%m-%d)
              # Check via gh api (authenticated, reliable)
              HTTP_CODE=$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${TODAY}?ref=gh-pages" \
                --jq ".type" 2>/dev/null || echo "404")
              if [ "$HTTP_CODE" != "dir" ]; then
                echo "↻ Catchup: today's report ($TODAY) missing from gh-pages — recovering"
                catchup_match=true
              else
                echo "Catchup: today's report already exists — no action"
              fi
            fi
          fi

          if [ "$hour_match" = "true" ] && [ "$day_match" = "true" ]; then
            echo "✓ Hour+day match — proceeding to build"
            echo "should-run=true" >> "$GITHUB_OUTPUT"
          elif [ "$catchup_match" = "true" ]; then
            echo "✓ Catchup match — proceeding to build"
            echo "should-run=true" >> "$GITHUB_OUTPUT"
          else
            echo "✗ No match (hour=$hour_match day=$day_match catchup=$catchup_match)"
            echo "should-run=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build & publish
    needs: gate
    if: needs.gate.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify Node.js version
        run: node -e "if (Number(process.versions.node.split('.')[0]) < 20) process.exit(1)"
      - run: npm ci

      - name: Restore existing reports from gh-pages
        run: |
          mkdir -p daily_reports
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages --depth=1
            git --work-tree=daily_reports checkout origin/gh-pages -- . || true
            rm -f daily_reports/index.html daily_reports/archive.html
            echo "Restored prior reports"
          fi

      - name: Generate today's report
        timeout-minutes: 18
        env:
          LLM_BACKEND: ${{ vars.LLM_BACKEND || 'anthropic' }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          FRESHRSS_API_URL: ${{ vars.FRESHRSS_API_URL }}
          FRESHRSS_API_TOKEN: ${{ secrets.FRESHRSS_API_TOKEN }}
          MINIFLUX_API_URL: ${{ vars.MINIFLUX_API_URL }}
          MINIFLUX_API_TOKEN: ${{ secrets.MINIFLUX_API_TOKEN }}
          READER_FETCH_LIMIT: ${{ vars.READER_FETCH_LIMIT }}
          REPORT_FRESHNESS_HOURS: ${{ vars.REPORT_FRESHNESS_HOURS }}
          MIN_FRESH_ARTICLES: ${{ vars.MIN_FRESH_ARTICLES }}
          REPORT_LOCALE: ${{ vars.REPORT_LOCALE || 'zh' }}
          REPORT_TZ: ${{ vars.REPORT_TZ }}
          WEB_MODE: "true"
        run: npm run daily

      - name: Build static site (index + archive)
        run: npm run build-site

      - name: Publish to gh-pages
        run: |
          set -euo pipefail
          PUBLISH_DIR="$RUNNER_TEMP/daily-brief-pages"
          git worktree add --detach "$PUBLISH_DIR"
          pushd "$PUBLISH_DIR"
          git switch --orphan pages-publish
          git rm -rf . || true
          cp -R "$GITHUB_WORKSPACE/daily_reports/." .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "daily: report for ${{ github.run_id }}"
          git push --force origin HEAD:gh-pages

      - name: Upload run diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: daily-brief-diagnostics-${{ github.run_id }}
          path: |
            logs/daily-*.log
            logs/enrich-*.txt
            daily_reports/*/source-health.json
          if-no-files-found: warn
          retention-days: 14
